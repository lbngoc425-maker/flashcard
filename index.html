<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Học Từ Vựng</title>
  <!-- Thư viện hỗ trợ đọc file Word (.docx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --success-color: #10b981;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .file-upload-box {
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px dashed var(--primary-color);
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .file-upload-box input {
      display: none;
    }

    .progress-bar {
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 15px;
    }

    /* Khung Flashcard */
    .flashcard-wrapper {
      width: 100%;
      max-width: 450px;
      height: 320px;
      perspective: 1000px;
      margin-bottom: 20px;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .flashcard.step-1 { transform: rotateY(0deg); }
    .flashcard.step-2 { transform: rotateY(180deg); }
    .flashcard.step-3 { transform: rotateY(360deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    /* Trang 1: Nghe phát âm */
    .face-1 .audio-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .face-1 .audio-btn:active {
      transform: scale(0.95);
    }

    /* Trang 2: Chi tiết từ vựng */
    .face-2 {
      transform: rotateY(180deg);
    }

    .word-title {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 5px;
    }

    .phonetic {
      font-size: 1.1rem;
      color: #6b7280;
      margin-bottom: 15px;
    }

    .meaning {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .example {
      font-size: 0.95rem;
      font-style: italic;
      color: #4b5563;
      background: #f9fafb;
      padding: 10px;
      border-radius: 8px;
      border-left: 4px solid var(--primary-color);
      width: 100%;
    }

    /* Trang 3: Chính tả */
    .face-3 {
      transform: rotateY(0deg);
    }

    .spelling-input {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
      outline: none;
    }

    .spelling-input:focus {
      border-color: var(--primary-color);
    }

    .feedback {
      margin-top: 10px;
      font-weight: bold;
      min-height: 24px;
    }

    /* Nút điều hướng */
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 450px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: var(--primary-color);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #6b7280;
    }

    .btn-secondary:hover {
      background-color: #4b5563;
    }

    .hint-text {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Flashcard Học Từ Vựng</h1>
    <p>Học phát âm - Chi tiết từ - Kiểm tra chính tả</p>
  </header>

  <!-- Khung Tải File -->
  <label class="file-upload-box">
    <strong>📂 Chạm để tải file (.docx, .csv, .json)</strong>
    <p style="font-size: 0.8rem; color: #6b7280; margin-top: 4px;">Hỗ trợ file Word định dạng: Từ | /Phiên âm/ | Nghĩa | Ví dụ</p>
    <input type="file" id="fileInput" accept=".docx, .csv, .json">
  </label>

  <div class="progress-bar" id="progress">Từ 1 / 3</div>

  <!-- Flashcard -->
  <div class="flashcard-wrapper">
    <div class="flashcard step-1" id="card">
      
      <!-- Trang 1: Chỉ phát âm -->
      <div class="card-face face-1" id="face1">
        <button class="audio-btn" onclick="playAudio(event)">🔊</button>
        <p style="margin-top: 15px; color: #6b7280;">Nghe và đoán từ...</p>
        <p class="hint-text">Chạm vào thẻ để xem chi tiết</p>
      </div>

      <!-- Trang 2: Từ, Phiên âm, Nghĩa, Ví dụ -->
      <div class="card-face face-2" id="face2">
        <div class="word-title" id="word">Apple</div>
        <div class="phonetic" id="phonetic">/ˈæp.əl/</div>
        <div class="meaning" id="meaning">Quả táo</div>
        <div class="example" id="example">I eat an apple every morning.</div>
        <p class="hint-text">Chạm để sang trang viết chính tả</p>
      </div>

      <!-- Trang 3: Viết chính tả -->
      <div class="card-face face-3" id="face3" style="display: none;">
        <h3>Viết lại từ vựng</h3>
        <p style="font-size: 0.9rem; color: #6b7280; margin-top: 5px;" id="hintMeaning">Nghĩa: Quả táo</p>
        <input type="text" class="spelling-input" id="spellingInput" placeholder="Nhập từ chính xác..." autocomplete="off">
        <div class="feedback" id="feedback"></div>
      </div>

    </div>
  </div>

  <!-- Điều hướng -->
  <div class="controls">
    <button class="btn btn-secondary" onclick="prevCard()">Lùi lại</button>
    <button class="btn" onclick="nextStep()">Tiếp theo</button>
  </div>

  <script>
    // Dữ liệu mặc định mẫu
    let words = [
      { word: "Apple", phonetic: "/ˈæp.əl/", meaning: "Quả táo", example: "I eat an apple every morning." },
      { word: "Developer", phonetic: "/dɪˈvel.ə.pər/", meaning: "Lập trình viên", example: "She works as a software developer." },
      { word: "Mountain", phonetic: "/ˈmaʊn.tɪn/", meaning: "Ngọn núi", example: "They climbed the mountain." }
    ];

    let currentIndex = 0;
    let currentStep = 1; // 1: Nghe, 2: Chi tiết, 3: Chính tả

    const card = document.getElementById('card');
    const face1 = document.getElementById('face1');
    const face2 = document.getElementById('face2');
    const face3 = document.getElementById('face3');

    // Tải dữ liệu lên giao diện
    function loadCard() {
      const data = words[currentIndex];
      document.getElementById('progress').innerText = `Từ ${currentIndex + 1} / ${words.length}`;
      
      document.getElementById('word').innerText = data.word;
      document.getElementById('phonetic').innerText = data.phonetic || '';
      document.getElementById('meaning').innerText = data.meaning || '';
      document.getElementById('example').innerText = data.example || '';
      document.getElementById('hintMeaning').innerText = `Nghĩa: ${data.meaning}`;
      
      document.getElementById('spellingInput').value = '';
      document.getElementById('feedback').innerText = '';

      // Tự động phát âm khi chuyển sang từ mới ở Trang 1
      if (currentStep === 1) {
        speakText(data.word);
      }
    }

    // Phát âm chuẩn bằng giọng Google
    function speakText(text) {
      if (!text) return;
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
      const audio = new Audio(url);
      audio.play().catch(() => {
        // Dự phòng giọng trình duyệt
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      });
    }

    function playAudio(e) {
      e.stopPropagation();
      speakText(words[currentIndex].word);
    }

    // Chuyển giữa các trang (Step 1 -> 2 -> 3)
    card.addEventListener('click', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
      nextStep();
    });

    function nextStep() {
      if (currentStep === 1) {
        currentStep = 2;
        face1.style.display = 'none';
        face2.style.display = 'flex';
        face3.style.display = 'none';
        card.className = 'flashcard step-2';
      } else if (currentStep === 2) {
        currentStep = 3;
        face1.style.display = 'none';
        face2.style.display = 'none';
        face3.style.display = 'flex';
        card.className = 'flashcard step-3';
        document.getElementById('spellingInput').focus();
      } else {
        // Tự động sang từ tiếp theo nếu đã ở bước 3
        nextCard();
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        resetCardState();
      }
    }

    function nextCard() {
      if (currentIndex < words.length - 1) {
        currentIndex++;
        resetCardState();
      } else {
        alert("Bạn đã hoàn thành hết danh sách từ vựng!");
        currentIndex = 0;
        resetCardState();
      }
    }

    function resetCardState() {
      currentStep = 1;
      face1.style.display = 'flex';
      face2.style.display = 'none';
      face3.style.display = 'none';
      card.className = 'flashcard step-1';
      loadCard();
    }

    // Kiểm tra chính tả
    document.getElementById('spellingInput').addEventListener('input', function(e) {
      const inputVal = e.target.value.trim().toLowerCase();
      const targetVal = words[currentIndex].word.trim().toLowerCase();
      const feedback = document.getElementById('feedback');

      if (inputVal === targetVal) {
        feedback.innerText = "✓ Chính xác!";
        feedback.style.color = "var(--success-color)";
        setTimeout(() => {
          nextCard();
        }, 800);
      } else {
        feedback.innerText = "❌ Chưa chính xác";
        feedback.style.color = "#ef4444";
      }
    });

    // Đọc File Upload (.docx, .csv, .json)
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileName = file.name;
      
      if (fileName.endsWith('.docx')) {
        const reader = new FileReader();
        reader.onload = function(event) {
          mammoth.extractRawText({ arrayBuffer: event.target.result })
            .then(function(result) {
              parseDocxContent(result.value);
            });
        };
        reader.readAsArrayBuffer(file);
      } else if (fileName.endsWith('.json')) {
        const reader = new FileReader();
        reader.onload = function(event) {
          try {
            words = JSON.parse(event.target.result);
            currentIndex = 0;
            resetCardState();
          } catch(err) { alert("File JSON không hợp lệ!"); }
        };
        reader.readAsText(file);
      }
    });

    // Phân tích dữ liệu từ file Word (.docx)
    function parseDocxContent(text) {
      const lines = text.split('\n').filter(line => line.trim() !== '');
      const parsedWords = [];

      lines.forEach(line => {
        // Phân tách bằng dấu gạch đứng | hoặc gạch ngang -
        const parts = line.split(/[|-]/).map(item => item.trim());
        if (parts.length >= 1 && parts[0] !== '') {
          parsedWords.push({
            word: parts[0] || '',
            phonetic: parts[1] || '',
            meaning: parts[2] || '',
            example: parts[3] || ''
          });
        }
      });

      if (parsedWords.length > 0) {
        words = parsedWords;
        currentIndex = 0;
        resetCardState();
        alert(`Tải thành công ${words.length} từ vựng từ file Word!`);
      } else {
        alert("Không tìm thấy dữ liệu phù hợp trong file Word. Hãy đảm bảo nội dung dòng dạng: Từ | Phiên âm | Nghĩa | Ví dụ");
      }
    }

    // Khởi chạy ban đầu
    loadCard();
  </script>
</body>
</html>
